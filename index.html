<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>心率儲備 (HRR) 計算器 - ACSM 標準</title>
  <style>
    :root {
      --primary: #ff4757;
      --bg: #f1f2f6;
      --card-bg: #ffffff;
      --text: #2f3542;
      --text-muted: #747d8c;
      --highlight: #ff788820;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .calculator-card {
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      max-width: 460px;
      width: 100%;
      padding: 28px;
    }

    h1 {
      font-size: 1.4rem;
      color: var(--primary);
      text-align: center;
      margin-bottom: 20px;
    }

    .input-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 0.9rem;
    }

    input[type="number"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #dfe4ea;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="number"]:focus {
      border-color: var(--primary);
    }

    /* 滑軌上方的 ACSM 區間卡片樣式 */
    .acsm-summary {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 18px;
    }

    .range-box {
      border-radius: 8px;
      padding: 10px;
      text-align: center;
    }

    .range-box.moderate {
      border: 1px solid #2ed57350;
      background-color: #2ed57310;
    }

    .range-box.vigorous {
      border: 1px solid #ffa50250;
      background-color: #ffa50210;
    }

    .range-title {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 4px;
      display: block;
    }

    .range-num {
      font-size: 0.95rem;
      font-weight: bold;
      color: var(--text);
    }

    .slider-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .slider-value {
      font-weight: bold;
      color: var(--primary);
    }

    input[type="range"] {
      width: 100%;
      margin-top: 8px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .results {
      background: var(--highlight);
      border-left: 4px solid var(--primary);
      border-radius: 8px;
      padding: 14px 16px;
      margin: 20px 0;
    }

    .result-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 0.9rem;
    }

    .result-target {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--primary);
      border-top: 1px dashed #ff788850;
      padding-top: 8px;
      margin-top: 8px;
    }

    .zone-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }

    .zone-table th, .zone-table td {
      padding: 8px 10px;
      text-align: left;
      border-bottom: 1px solid #f1f2f6;
    }

    .zone-table th {
      background-color: #f8f9fa;
      color: var(--text-muted);
    }

    .active-zone {
      background-color: var(--highlight);
      font-weight: bold;
      color: var(--primary);
    }
  </style>
</head>
<body>

<div class="calculator-card">
  <h1>心率儲備 (HRR) 計算器</h1>

  <div class="input-group">
    <label for="age">年齡 (歲)</label>
    <input type="number" id="age" value="30" min="1" max="120">
  </div>

  <div class="input-group">
    <label for="restHr">靜息心率 (bpm)</label>
    <input type="number" id="restHr" value="60" min="30" max="120">
  </div>

  <!-- ACSM 中強度與高強度即時心率範圍 -->
  <div class="acsm-summary">
    <div class="range-box moderate">
      <span class="range-title">中強度 (40-59%)</span>
      <span class="range-num" id="modRange">112 - 137 bpm</span>
    </div>
    <div class="range-box vigorous">
      <span class="range-title">高強度 (60-89%)</span>
      <span class="range-num" id="vigRange">138 - 176 bpm</span>
    </div>
  </div>

  <div class="input-group">
    <div class="slider-header">
      <label for="intensity">自訂目標強度 (%HRR)</label>
      <span class="slider-value" id="intensityVal">60%</span>
    </div>
    <input type="range" id="intensity" min="30" max="95" value="60" step="1">
  </div>

  <div class="results">
    <div class="result-item">
      <span>預估最大心率</span>
      <span id="maxHr">190 bpm</span>
    </div>
    <div class="result-item">
      <span>心率儲備 (HRR)</span>
      <span id="hrr">130 bpm</span>
    </div>
    <div class="result-item result-target">
      <span>目標心率 (THR)</span>
      <span id="targetHr">138 bpm</span>
    </div>
  </div>

  <table class="zone-table">
    <thead>
      <tr>
        <th>強度 (%HRR)</th>
        <th>ACSM 分級說明</th>
      </tr>
    </thead>
    <tbody>
      <tr id="zone1"><td>30% - 39%</td><td>低強度 (Light)</td></tr>
      <tr id="zone2"><td>40% - 59%</td><td>中等強度 (Moderate)</td></tr>
      <tr id="zone3"><td>60% - 89%</td><td>高強度 / 劇烈 (Vigorous)</td></tr>
      <tr id="zone4"><td>≥ 90%</td><td>近乎最大強度 (Near-maximal)</td></tr>
    </tbody>
  </table>
</div>

<script>
  const ageInput = document.getElementById('age');
  const restHrInput = document.getElementById('restHr');
  const intensityInput = document.getElementById('intensity');
  const intensityVal = document.getElementById('intensityVal');

  const maxHrEl = document.getElementById('maxHr');
  const hrrEl = document.getElementById('hrr');
  const targetHrEl = document.getElementById('targetHr');
  const modRangeEl = document.getElementById('modRange');
  const vigRangeEl = document.getElementById('vigRange');

  function calculate() {
    const age = parseInt(ageInput.value) || 0;
    const restHr = parseInt(restHrInput.value) || 0;
    const intensity = parseInt(intensityInput.value) || 0;

    intensityVal.textContent = intensity + '%';

    if (age <= 0 || restHr <= 0) {
      maxHrEl.textContent = '-';
      hrrEl.textContent = '-';
      targetHrEl.textContent = '-';
      modRangeEl.textContent = '-';
      vigRangeEl.textContent = '-';
      return;
    }

    const maxHr = 220 - age;
    const hrr = maxHr - restHr;
    const targetHr = Math.round((hrr * (intensity / 100)) + restHr);

    // 計算 ACSM 中強度 (40-59%) 與 高強度 (60-89%) 區間
    const modMin = Math.round((hrr * 0.40) + restHr);
    const modMax = Math.round((hrr * 0.59) + restHr);
    const vigMin = Math.round((hrr * 0.60) + restHr);
    const vigMax = Math.round((hrr * 0.89) + restHr);

    maxHrEl.textContent = maxHr + ' bpm';
    hrrEl.textContent = (hrr > 0 ? hrr : 0) + ' bpm';
    targetHrEl.textContent = (targetHr > 0 ? targetHr : 0) + ' bpm';

    modRangeEl.textContent = `${modMin} - ${modMax} bpm`;
    vigRangeEl.textContent = `${vigMin} - ${vigMax} bpm`;

    const zones = [
      { id: 'zone1', min: 30, max: 39 },
      { id: 'zone2', min: 40, max: 59 },
      { id: 'zone3', min: 60, max: 89 },
      { id: 'zone4', min: 90, max: 100 }
    ];

    zones.forEach(zone => {
      const el = document.getElementById(zone.id);
      if (intensity >= zone.min && intensity <= zone.max) {
        el.classList.add('active-zone');
      } else {
        el.classList.remove('active-zone');
      }
    });
  }

  ageInput.addEventListener('input', calculate);
  restHrInput.addEventListener('input', calculate);
  intensityInput.addEventListener('input', calculate);

  calculate();
</script>
</body>
</html>
