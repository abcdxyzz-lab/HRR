<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>心率儲備 (HRR) 計算器</title>
  <style>
    :root {
      --primary: #ff4757;
      --bg: #f1f2f6;
      --card-bg: #ffffff;
      --text: #2f3542;
      --text-muted: #747d8c;
      --highlight: #ff788820;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .calculator-card {
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      max-width: 440px;
      width: 100%;
      padding: 28px;
    }

    h1 {
      font-size: 1.4rem;
      color: var(--primary);
      text-align: center;
      margin-bottom: 20px;
    }

    .input-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 0.9rem;
    }

    input[type="number"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #dfe4ea;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="number"]:focus {
      border-color: var(--primary);
    }

    .slider-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
